# Fetches prices on a GitHub runner and publishes the dashboard to GitHub Pages.
#
# Every run: restore the SQLite file from the `market-data` branch, fetch new completed
# daily candles and the latest delayed price for every watchlist stock and benchmark (Yahoo
# Finance via yfinance), export every screen as JSON, build the static dashboard, and save the
# database back to `market-data` (public price data only: no positions, no secrets).
# Only runs on the default branch deploy the site; runs on other branches build and fetch only.
#
# GitHub may start scheduled runs late when it is busy, and turns schedules off in a public
# repository after 60 days with no activity. The site shows its last update time and warns
# when that is older than `site.stale_after_minutes` (config/settings.yaml) during a session.
name: Publish site

on:
  schedule:
    # India: NSE 09:15-15:30 Asia/Kolkata = 03:45-10:00 UTC, plus the 30 min close buffer.
    - cron: "*/15 3-10 * * 1-5"
    # US: NYSE 09:30-16:00 America/New_York = 13:30-20:00 UTC (summer) or 14:30-21:00 UTC
    # (winter), plus the 30 min close buffer. Keep in step with site.update_every_minutes.
    - cron: "*/15 13-21 * * 1-5"
    # Once a day, every day, so weekends, holidays and corporate actions are picked up.
    - cron: "41 23 * * *"
  workflow_dispatch:
  push:
    branches: [main, data]
    paths:
      - backend/**
      - frontend/**
      - config/**
      - .github/workflows/publish-site.yml

permissions:
  contents: write # save the database to the market-data branch
  pages: write
  id-token: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore the database from the market-data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin market-data; then
            git show FETCH_HEAD:market.db > data/market.db
            echo "restored $(du -h data/market.db | cut -f1) database"
          else
            echo "no market-data branch yet: starting from an empty database"
          fi

      - run: pip install -e ./backend

      - name: Fetch daily candles and latest prices
        working-directory: backend
        run: |
          set -o pipefail
          python -m app.cli 2>fetch-errors.log | tee fetch-report.txt || true
          echo "---- provider messages (last 40 lines) ----"
          tail -n 40 fetch-errors.log || true

      - name: Export every screen as JSON
        working-directory: backend
        run: python -m app.export ../site-data --scheduled

      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          VITE_STATIC=1 npx vite build --outDir ../site
          cp -r ../site-data ../site/data
          touch ../site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Save the database to the market-data branch
        run: |
          mkdir snapshot
          cp data/market.db backend/fetch-report.txt site-data/quotes.json snapshot/
          cd snapshot
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f market.db fetch-report.txt quotes.json
          git commit -q -m "Market data $(date -u +%FT%TZ) from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" market-data

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
