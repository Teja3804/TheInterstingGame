# Fetches prices on a GitHub runner and publishes the dashboard to GitHub Pages.
#
# Every run: restore the SQLite file from the `market-data` branch, fetch new completed
# daily candles and the latest delayed price for every watchlist stock and benchmark (Yahoo
# Finance via yfinance), export every screen as JSON, build the static dashboard, and save the
# database back to `market-data` (public price data only: no positions, no secrets).
# Only runs on the default branch deploy the site; runs on other branches build and fetch only.
#
# Timing: GitHub's cron is best-effort (runs can be hours late or skipped), so on the default
# branch every run ends with a `next` job that works out when the next run is due
# (`python -m app.next_run`: every `site.update_every_minutes` while a market is open or just
# closed, otherwise at the next open or after `site.idle_max_minutes`), waits, and starts it
# with workflow_dispatch. The cron lines below are only a backup that restarts the chain if it
# ever stops. A newer `next` job cancels an older waiting one, so only one chain runs.
# The site shows its last update time and warns when it is late.
name: Publish site

on:
  schedule:
    # Backup only (see above). India: 03:45-10:00 UTC. US: 13:30-21:00 UTC.
    - cron: "7 3-10 * * 1-5"
    - cron: "7 13-21 * * 1-5"
    - cron: "41 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, data]
    paths:
      - backend/**
      - frontend/**
      - config/**
      - .github/workflows/publish-site.yml

permissions:
  contents: write # save the database to the market-data branch
  pages: write
  id-token: write
  actions: write # start the next run

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-site-build
      cancel-in-progress: false
    outputs:
      started: ${{ steps.start.outputs.started }}
    steps:
      - id: start
        run: echo "started=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore the database from the market-data branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin market-data; then
            git show FETCH_HEAD:market.db > data/market.db
            echo "restored $(du -h data/market.db | cut -f1) database"
          else
            echo "no market-data branch yet: starting from an empty database"
          fi

      - run: pip install -e ./backend

      - name: Fetch daily candles and latest prices
        working-directory: backend
        run: |
          set -o pipefail
          python -m app.cli 2>fetch-errors.log | tee fetch-report.txt || true
          echo "---- provider messages (last 40 lines) ----"
          tail -n 40 fetch-errors.log || true

      - name: Export every screen as JSON
        working-directory: backend
        run: python -m app.export ../site-data --scheduled

      - name: Build the dashboard
        working-directory: frontend
        run: |
          npm ci
          VITE_STATIC=1 npx vite build --outDir ../site
          cp -r ../site-data ../site/data
          touch ../site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Save the database to the market-data branch
        run: |
          mkdir snapshot
          cp data/market.db backend/fetch-report.txt site-data/quotes.json snapshot/
          cd snapshot
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f market.db fetch-report.txt quotes.json
          git commit -q -m "Market data $(date -u +%FT%TZ) from ${GITHUB_REF_NAME}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" market-data

  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    concurrency:
      group: publish-site-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  next:
    needs: [build, deploy]
    if: >-
      !cancelled() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: publish-site-next
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ./backend
      - id: plan
        working-directory: backend
        run: python -m app.next_run --started "${{ needs.build.outputs.started }}" | tee -a "$GITHUB_OUTPUT"
      - name: Wait until the next run is due
        run: sleep ${{ steps.plan.outputs.seconds }}
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh run list --repo "${{ github.repository }}" --workflow publish-site.yml \
            --limit 20 --json databaseId,status \
            --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")] | length')
          if [ "$others" -gt 0 ]; then
            echo "another run is already queued or running; it continues the chain"
          else
            gh workflow run publish-site.yml --repo "${{ github.repository }}" \
              --ref "${{ github.event.repository.default_branch }}"
            echo "started the next run (${{ steps.plan.outputs.reason }})"
          fi
